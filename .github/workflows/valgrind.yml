name: Valgrind

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  valgrind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            libev-dev libpcre2-dev libc-ares-dev libssl-dev \
            libbsd-dev libseccomp-dev valgrind

      - name: Generate build system
        run: |
          set -euo pipefail
          AUTOCONF_VERSION=2.71 AUTOMAKE_VERSION=1.16 ./autogen.sh

      - name: Configure
        run: |
          set -euo pipefail
          ./configure --disable-dependency-tracking

      - name: Build targeted tests
        run: |
          set -euo pipefail
          make -j"$(nproc)" -C tests \
            buffer_test \
            cfg_tokenizer_test \
            address_test \
            table_test \
            tls_test \
            dtls_test \
            http_test \
            xmpp_test \
            minecraft_test \
            ipc_crypto_debug_test \
            ipc_crypto_rekey_test \
            ipc_crypto_time_rekey_test

      - name: Run valgrind on tests
        run: |
          set -euo pipefail
          mkdir -p valgrind-logs
          for bin in \
            tests/buffer_test \
            tests/cfg_tokenizer_test \
            tests/address_test \
            tests/table_test \
            tests/tls_test \
            tests/dtls_test \
            tests/http_test \
            tests/xmpp_test \
            tests/minecraft_test \
            tests/ipc_crypto_debug_test \
            tests/ipc_crypto_rekey_test \
            tests/ipc_crypto_time_rekey_test; do
            echo "valgrind $bin"
            name=$(basename "$bin")
            log="valgrind-logs/${name}.log"
            if ! valgrind --leak-check=full --errors-for-leak-kinds=all --show-leak-kinds=all --track-origins=yes --error-exitcode=1 "$bin" &> "$log"; then
              echo "Valgrind failures in $bin:"
              cat "$log"
              exit 1
            fi
          done

      - name: Build sniproxy
        run: make -j"$(nproc)" -C src

      # The unit tests above leave the processes and the IPC out
      - name: Run sniproxy under valgrind
        run: |
          set -euo pipefail
          mkdir -p valgrind-logs/live live/www
          cd live
          echo hello > www/index.html
          printf 'user %s\nlistener 127.0.0.1:18080 {\n    protocol http\n    table t\n}\ntable t {\n    localhost 127.0.0.1:18081\n}\n' \
            "$(id -un)" > sniproxy.conf
          chmod 600 sniproxy.conf
          python3 -m http.server 18081 --bind 127.0.0.1 --directory www \
            > backend.log 2>&1 &
          backend=$!
          # valgrind cannot run under the seccomp filters. glibc's cleanup
          # at exit clears environ, which would leave the copy the process
          # title code keeps of it looking lost.
          SNIPROXY_DISABLE_SECCOMP=1 valgrind --run-libc-freeres=no \
            --leak-check=full --errors-for-leak-kinds=definite,indirect \
            --error-exitcode=1 --track-origins=yes \
            --log-file=../valgrind-logs/live/sniproxy.%p.log \
            ../src/sniproxy -f -c sniproxy.conf > sniproxy.log 2>&1 &
          proxy=$!
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:18080/ && break
            sleep 1
          done
          curl -sf -H 'Host: localhost' http://127.0.0.1:18080/
          kill -HUP "$proxy"
          sleep 2
          curl -sf -H 'Host: localhost' http://127.0.0.1:18080/
          kill -USR1 "$proxy"
          sleep 1
          kill -TERM "$proxy"
          status=0
          wait "$proxy" || status=$?
          kill "$backend" || true
          cat sniproxy.log
          # One log per process: the main one and its helpers
          bad=0
          for log in ../valgrind-logs/live/*.log; do
            grep -q 'ERROR SUMMARY: 0 errors' "$log" || bad=1
          done
          if [ "$status" -ne 0 ] || [ "$bad" -ne 0 ]; then
            cat ../valgrind-logs/live/*.log
            exit 1
          fi

      - name: Upload valgrind logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: valgrind-logs
          path: valgrind-logs/
          if-no-files-found: ignore
